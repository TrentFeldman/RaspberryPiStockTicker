[weather]
# Weather in the scrolling strip (off hours), from wttr.in: free, no key.
# location: a city ("Ulaanbaatar"), a US ZIP ("10001") or "lat,lon".
# Empty = wttr.in guesses from this internet connection's IP address.
location = ""
units = "F"            # "F" (Fahrenheit) or "C" (Celsius)

[schedule]
# All times are local to this timezone. Trading-day open/close (including
# holidays and early closes) come from the tastytrade sessions API.
timezone = "America/New_York"
# Account value is shown from here until the regular open on trading days.
premarket_start = "06:30"
# Night: account + strip of weather (+ 24h stocks during an overnight session), dimmed.
# Applies every day, weekends included.
night_start = "20:00"
night_end = "06:30"
# Sleep: the night-sky screen, from sleep_start until night_end.
sleep_start = "23:00"

[rotation]
# Market hours: one random stock fills the panel at a time, for `seconds`
# each (minimum 5). `lead_sec` before its turn the fetcher picks it and
# fetches just that one quote: 6 s turns = 10 tiny requests a minute, no
# matter how long the symbol list is.
seconds = 6
lead_sec = 2
# Off hours: how many random picks the scrolling strip shows. A new set is
# picked (one request) every quotes_day / quotes_night below.
strip = 10

[intervals]
# Seconds between refreshes. Errors back off automatically (5 s doubling,
# capped at 5 min); auth failures pause tastytrade calls for auth_backoff.
# New random strip picks (off hours):
quotes_day = 60        # pre-market / after hours
quotes_night = 120     # weekend / overnight
# Account value (net-liq), shown in all off hours:
account = 120          # pre-market / after hours
account_quiet = 600    # weekend / overnight: barely moves
sessions = 600
weather = 1800         # wttr.in is a free hobby service: every 30 min is plenty
heartbeat = 600
auth_backoff = 1800
instruments = 86400   # daily symbol check: which exist, which trade 24/5

[display]
brightness_day = 75
brightness_night = 15
brightness_sleep = 20
# Big movers: up or down at least this % today get a gold frame
# and "BIG MOVE", and come up once more within a few minutes.
big_move_pct = 5

[pretend]
# Test mode switches itself off after this long, so the wall display can't
# get stuck showing a fake time.
max_minutes = 60

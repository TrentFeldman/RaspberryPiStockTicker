# hub75 ticker fetcher configuration.
#
# The fetcher reads this file at start-up; restart it after editing:
#   sudo systemctl restart hub75-fetcher
# Paths are relative to the project folder (absolute paths and ~ work too).

[paths]
# tastytrade OAuth credentials: two lines, client_secret=... and refresh_token=...
# Keep this file private (chmod 600). Never commit or share it.
credentials = "ticker/tastytrade.conf"
# File the LED ticker reads. Written atomically every refresh.
display = "ticker/display.txt"
# Rotating log (1 MB x 5 files). Also mirrored to the systemd journal.
log_file = "logs/fetcher.log"
# Test mode: pretend.sh writes this to make the fetcher pretend it's
# another time of day (see README "Test mode"). Missing file = real time.
pretend = "pretend.json"

[api]
base_url = "https://api.tastyworks.com"
timeout_sec = 15

[symbols]
# The pool the ticker picks from at random (no repeats until every eligible
# symbol has been shown). Market hours: everything. Off hours: only
# the stocks/ETFs that trade 24/5 (tastytrade says which, checked daily).
# Weekends: none (the strip shows the weather). Order doesn't matter; duplicates are ignored.
#
# tastytrade symbology: class B shares use a slash (BRK/B). ETFs are
# equities to the API; they are listed separately only for readability.
# Long lists cost nothing extra: only the stock about to be shown is fetched.
# Symbols tastytrade doesn't know are logged at start-up and never picked
# (`fetcher.py --check` lists them). Restart the fetcher after editing:
#   sudo systemctl restart hub75-fetcher

